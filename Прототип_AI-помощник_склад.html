<div class="side-foot">Демонстрационный прототип MVP.<br>Данные синтетические, расчёт на 01.10.2026.<br>Филиалы: Роза Хутор, Сириус, Адлер.</div></aside>

<script>// ===== Демо-датасет (синтетические данные) =====
const TODAY = new Date(2026, 9, 1); // 01.10.2026
const DAY = 86400000;
const MONTHS = [ // горизонт планирования: окт 2026 — сен 2027
  {y:2026,m:9},{y:2026,m:10},{y:2026,m:11},{y:2027,m:0},{y:2027,m:1},{y:2027,m:2},
  {y:2027,m:3},{y:2027,m:4},{y:2027,m:5},{y:2027,m:6},{y:2027,m:7},{y:2027,m:8}];
const MNAME = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monthDays = (y,m) => new Date(y, m+1, 0).getDate();

const BRANCHES = [
  {id:'rh', name:'Роза Хутор', line:'Mountain SPA'},
  {id:'sr', name:'Сириус',     line:'Sea SPA'},
  {id:'ad', name:'Адлер',      line:'Sea SPA'},
];
const SERVICES = [
  {id:'m60',   name:'Массажный ритуал 60 мин',  price:5500, share:1.00},
  {id:'sport', name:'Спортивный массаж 90 мин', price:7000, share:0.25},
  {id:'wrap',  name:'Обёртывание водорослями',  price:4800, share:0.20},
  {id:'cedar', name:'Кедровая бочка',           price:2500, share:0.30},
  {id:'face',  name:'Уход за лицом',            price:6000, share:0.20},
  {id:'hand',  name:'Экспресс-уход за руками',  price:1800, share:0.15},
];
// Плановая загрузка: массажные ритуалы 60 мин по месяцам окт..сен (прочие услуги — через долю share)
// Роза Хутор — горный курорт (пик зимой), Сириус/Адлер — море (пик летом)
const LOAD_M60 = {
  rh: [1200,1000,1400,1500,1300,1100,1000,1100,1300,1600,1700,1300],
  sr: [ 900, 700, 900, 800, 700, 800,1000,1300,1600,2000,2100,1500],
  ad: [ 720, 560, 720, 640, 560, 640, 800,1040,1280,1600,1680,1200],
};
// III квартал 2026 (июл–сен), факт — для сравнения бюджета
const LOAD_M60_PREV = { rh:[1600,1700,1300], sr:[2000,2100,1500], ad:[1600,1680,1200] };

const CATS = ['Массажные масла и кремы','Ароматерапия и травы','Обёртывания и скрабы','Уход за лицом и руками','Расходные материалы'];
const PRODUCTS = [
 {sku:'MO-01',name:'Масло массажное нейтральное',cat:0,unit:'л',pack:12,packName:'коробка 12 л',price:1850,prev:1700,supplier:'ООО «Арома-Юг»',lead:14,ss:10,shelf:730,norms:{m60:0.030}},
 {sku:'CR-02',name:'Крем для спортивного массажа',cat:0,unit:'кг',pack:6,packName:'коробка 6 кг',price:2400,prev:2350,supplier:'ООО «СпортКосметик»',lead:10,ss:10,shelf:540,norms:{sport:0.025}},
 {sku:'OL-14',name:'Масло кокосовое (снятый ритуал)',cat:0,unit:'л',pack:6,packName:'коробка 6 л',price:1300,prev:1300,supplier:'ООО «Арома-Юг»',lead:14,ss:10,shelf:540,norms:{}},
 {sku:'AR-03',name:'Эфирное масло лаванды 10 мл',cat:1,unit:'фл',pack:10,packName:'упаковка 10 фл',price:690,prev:560,supplier:'ООО «Арома-Юг»',lead:14,ss:10,shelf:900,norms:{m60:0.02}},
 {sku:'CD-06',cycle:1,name:'Травяной сбор для кедровой бочки',cat:1,unit:'кг',pack:10,packName:'мешок 10 кг',price:980,prev:950,supplier:'ИП «Горные травы»',lead:7,ss:7,shelf:180,norms:{cedar:0.05}},
 {sku:'WR-04',name:'Водоросли ламинарии для обёртывания',cat:2,unit:'кг',pack:5,packName:'упаковка 5 кг',price:3200,prev:2900,supplier:'ООО «Морские ресурсы»',lead:21,ss:14,shelf:365,norms:{wrap:0.10}},
 {sku:'SC-05',name:'Скраб солевой',cat:2,unit:'кг',pack:5,packName:'ведро 5 кг',price:1450,prev:1400,supplier:'ООО «Морские ресурсы»',lead:21,ss:14,shelf:240,norms:{wrap:0.08}},
 {sku:'DS-12',cycle:1,name:'Плёнка для обёртывания',cat:2,unit:'рул',pack:6,packName:'коробка 6 рул',price:890,prev:870,supplier:'ООО «ЮгРасходник»',lead:5,ss:7,shelf:3650,norms:{wrap:0.02}},
 {sku:'FC-07',cycle:1,name:'Маска тканевая с гиалуроновой кислотой',cat:3,unit:'шт',pack:50,packName:'коробка 50 шт',price:240,prev:230,supplier:'ООО «Космо Про»',lead:14,ss:10,shelf:540,norms:{face:1}},
 {sku:'FC-08',name:'Сыворотка для лица 30 мл',cat:3,unit:'фл',pack:12,packName:'коробка 12 фл',price:1650,prev:1600,supplier:'ООО «Космо Про»',lead:14,ss:10,shelf:365,norms:{face:0.1}},
 {sku:'MS-13',name:'Маска с голубой глиной (новинка)',cat:3,unit:'кг',pack:5,packName:'упаковка 5 кг',price:null,prev:null,supplier:'— не выбран —',lead:null,ss:10,shelf:365,norms:{face:0.03}},
 {sku:'HN-09',name:'Крем для рук 250 мл',cat:3,unit:'шт',pack:20,packName:'коробка 20 шт',price:520,prev:500,supplier:'ООО «Космо Про»',lead:14,ss:10,shelf:730,norms:{hand:0.05}},
 {sku:'DS-10',cycle:1,name:'Простыни одноразовые',cat:4,unit:'шт',pack:200,packName:'упаковка 200 шт',price:14,prev:13,supplier:'ООО «ЮгРасходник»',lead:5,ss:7,shelf:3650,norms:{m60:1,sport:1,wrap:1,face:1}},
 {sku:'DS-11',cycle:1,name:'Полотенца одноразовые',cat:4,unit:'шт',pack:500,packName:'коробка 500 шт',price:9,prev:9,supplier:'ООО «ЮгРасходник»',lead:5,ss:7,shelf:3650,norms:{m60:2,sport:2,wrap:2,cedar:2,face:1}},
];
const P = Object.fromEntries(PRODUCTS.map(p=>[p.sku,p]));

// Остатки, партии, открытые заказы, фактический расход — задаются через «покрытие в днях»
// и явные контрольные сценарии. cover = на сколько дней хватит текущего остатка.
const d = (s)=>{const [dd,mm,yy]=s.split('.').map(Number);return new Date(yy,mm-1,dd);};
const SEED = {
 rh: {
  'MO-01':{batches:[{id:'А-0712',qty:10,exp:'15.11.2026'},{id:'Б-0903',qty:15,exp:'30.06.2027'}],open:[{qty:20,date:'10.10.2026',no:'ЗК-1182',st:'подтверждён'}],k:1.05,last:1},
  'AR-03':{cover:8,k:1.02},
  'WR-04':{batches:[{id:'Л-0405',qty:14,exp:'10.11.2026'},{id:'Л-0820',qty:6,exp:'20.08.2027'}],k:0.98},
  'CD-06':{cover:160,k:1.0,expShift:45},
  'OL-14':{fixed:18,last:95,exp:'30.04.2027'},
  'MS-13':{fixed:2,last:3,exp:'01.06.2027'},
  'FC-07':{cover:40},'FC-08':{cover:45},'CR-02':{cover:35},'SC-05':{cover:50},'DS-12':{cover:40},'HN-09':{cover:42},'DS-10':{cover:30},'DS-11':{cover:28},
 },
 sr: {
  'CR-02':{cover:6,k:1.04},
  'SC-05':{batches:[{id:'С-0311',qty:9,exp:'12.11.2026'},{id:'С-0710',qty:8,exp:'15.03.2027'}]},
  'DS-10':{cover:5},
  'CD-06':{cover:30,sharp:1.45},
  'FC-07':{cover:150},
  'MO-01':{cover:34,k:1.03},'AR-03':{cover:40},'WR-04':{cover:45},'FC-08':{cover:38},'HN-09':{cover:36},'DS-11':{cover:25},'DS-12':{cover:35},
  'OL-14':{fixed:0,last:200},'MS-13':{fixed:0,last:0},
 },
 ad: {
  'WR-04':{cover:9,k:1.01},
  'FC-08':{batches:[{id:'Ф-0214',qty:6,exp:'05.11.2026'},{id:'Ф-0730',qty:10,exp:'30.07.2027'}]},
  'HN-09':{cover:140},
  'DS-11':{cover:4},
  'MO-01':{cover:38,k:1.0},'CR-02':{cover:40},'AR-03':{cover:36},'CD-06':{cover:28,sharp:0.62},'SC-05':{cover:44},'FC-07':{cover:35},'DS-10':{cover:32},'DS-12':{cover:40},
  'OL-14':{fixed:0,last:200},'MS-13':{fixed:0,last:0},
 },
};
// Заранее заложенные контрольные сценарии (для метрики «≥ 90% выявлено»)
const CONTROL = [
 ['deficit','rh','AR-03'],['deficit','sr','CR-02'],['deficit','sr','DS-10'],['deficit','ad','WR-04'],['deficit','ad','DS-11'],
 ['excess','rh','CD-06'],['excess','rh','OL-14'],['excess','sr','FC-07'],['excess','ad','HN-09'],
 ['expiry','rh','WR-04'],['expiry','rh','CD-06'],['expiry','sr','SC-05'],['expiry','ad','FC-08'],
 ['nomove','rh','OL-14'],['price','all','AR-03'],['price','all','WR-04'],['sharp','sr','CD-06'],['sharp','ad','CD-06'],['nodata','rh','MS-13'],
];

// ===== Расчётное ядро (детерминированные функции) =====
const round1 = x => Math.round(x*10)/10;
const addDays = (dt,n) => new Date(dt.getTime()+n*DAY);
const diffDays = (a,b) => Math.round((a-b)/DAY);
const fmtD = dt => dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});

function procedures(branch, svc, mi, adj){ // mi — индекс месяца горизонта
  const s = SERVICES.find(x=>x.id===svc);
  let v = LOAD_M60[branch][mi]*s.share;
  if (adj) v *= 1 + ((adj.all||0) + (adj[mi]||0))/100;
  return v;
}
function kFact(branch,sku){ return (SEED[branch][sku]&&SEED[branch][sku].k)||1; }
function monthForecast(branch, sku, mi, adj){
  const p=P[sku]; let q=0;
  for (const [svc,n] of Object.entries(p.norms)) q += procedures(branch,svc,mi,adj)*n;
  return q*kFact(branch,sku);
}
function prevQuarterForecast(branch, sku){
  const p=P[sku]; let q=0;
  for (const [svc,n] of Object.entries(p.norms)){
    const s=SERVICES.find(x=>x.id===svc);
    q += LOAD_M60_PREV[branch].reduce((a,b)=>a+b,0)*s.share*n;
  }
  return q*kFact(branch,sku);
}
// Строим склад: партии, открытые заказы, факт расхода
const STOCK = {};
(function build(){
  for (const b of BRANCHES){
    STOCK[b.id]={};
    for (const p of PRODUCTS){
      const s = SEED[b.id][p.sku]||{cover:35};
      const daily = [0,1,2].reduce((a,mi)=>a+monthForecast(b.id,p.sku,mi),0)/92;
      let batches=[];
      if (s.batches) batches = s.batches.map(x=>({id:x.id,qty:x.qty,exp:d(x.exp)}));
      else if (s.fixed!==undefined){ if (s.fixed>0) batches=[{id:p.sku.slice(0,2)+'-'+(1100+s.fixed),qty:s.fixed,exp:d(s.exp)}]; }
      else {
        let qty = daily*s.cover; qty = p.unit==='шт'?Math.round(qty):round1(qty);
        const q1 = p.unit==='шт'?Math.round(qty*0.4):round1(qty*0.4);
        const h=[...(p.sku+b.id)].reduce((a,c)=>a+c.charCodeAt(0),0); const e1 = addDays(TODAY, s.expShift!==undefined? s.expShift : Math.min(p.shelf-60, 130 + (h*37)%170));
        const e2 = addDays(TODAY, Math.max(p.shelf-30, 120));
        batches=[{id:p.sku.slice(0,2)+'-'+(700+q1%97|0),qty:q1,exp:e1},{id:p.sku.slice(0,2)+'-'+(900+(qty-q1)%89|0),qty:round1(qty-q1),exp:e2}];
        if (p.unit==='шт') batches[1].qty=Math.round(qty-q1);
      }
      const open=(s.open||[]).map(o=>({...o,date:d(o.date)}));
      const f90 = prevQuarterForecast(b.id,p.sku);                 // факт за 90 дней (июл–сен)
      const f30 = (f90/3)*(s.sharp||1);                          // факт за последние 30 дней
      STOCK[b.id][p.sku]={batches,open,fact90:f90,fact30:f30,lastMove:s.last!==undefined?s.last:1};
    }

})();

function available(branch, sku){
  return STOCK[branch][sku].batches.filter(x=>x.exp>=TODAY).reduce((a,x)=>a+x.qty,0);
}
const PERIODS = {month:{n:1,chunks:[1],label:'месяц',title:'Октябрь 2026'},quarter:{n:3,chunks:[3],label:'квартал',title:'IV квартал 2026'},
  half:{n:6,chunks:[3,3],label:'полугодие',title:'Октябрь 2026 — март 2027'},year:{n:12,chunks:[3,3,3,3],label:'год',title:'Октябрь 2026 — сентябрь 2027'}};

// Главная функция: рекомендация закупки по позиции и филиалу на горизонт
function calcPurchase(branch, sku, period='quarter', opt={}){
  const p=P[sku], st=STOCK[branch][sku], per=PERIODS[period];
  const ssDays = opt.ssDays!==undefined? opt.ssDays : p.ss;
  const avail = available(branch,sku);
  const res = {branch,sku,period,ssDays,avail,orders:[],chunks:[],warnings:[],nodata:[]};
  if (p.price==null) res.nodata.push('цена поставщика'); if (p.lead==null) res.nodata.push('срок поставки');
  let stock = avail, mi=0, start=new Date(TODAY);
  const openAll = st.open.slice();
  res.forecastMonths=[];
  const cyc = Math.min(p.cycle||3, per.n); const chunkList=[]; for(let k=0;k<per.n;k+=cyc) chunkList.push(Math.min(cyc,per.n-k));
  res.cycle=cyc;
  for (const len of chunkList){
    let F=0, D=0; const months=[];
    for (let i=0;i<len;i++,mi++){ const M=MONTHS[mi]; const f=monthForecast(branch,sku,mi,opt.adj); F+=f; D+=monthDays(M.y,M.m); months.push({mi,f}); res.forecastMonths.push({mi,f}); }
    const end = addDays(start,D);
    const daily = F/D, ss = ssDays*daily, lead=p.lead||0, rop = daily*lead+ss;
    const arr = openAll.filter(o=>o.date<end); arr.forEach(o=>openAll.splice(openAll.indexOf(o),1));
    const arrQty = arr.reduce((a,o)=>a+o.qty,0);
    const need = F + ss - stock - arrQty;
    let qty=0; if (need>0 && daily>0) qty = Math.max(p.pack, Math.ceil(need/p.pack-1e-9)*p.pack);
    let dateOff = daily>0? (stock+arrQty-rop)/daily : Infinity;
    let date=null, urgent=false;
    if (qty>0){ const first=start.getTime()===TODAY.getTime(); date = addDays(start, first? Math.max(0,Math.floor(dateOff)) : Math.floor(dateOff)); if (date<TODAY){date=new Date(TODAY);} if (dateOff<0 && first) urgent=true; }
    const maxUse = daily*((p.shelf||9999)-lead);
    const split = qty>0 && qty>maxUse;
    const endStock = stock+arrQty+qty-F;
    res.chunks.push({start,end,D,F,daily,ss,rop,arr,arrQty,need,qty,date,urgent,split,stockStart:stock,endStock,months,dateOff});
    if (qty>0) res.orders.push({qty,date,cost:p.price!=null?qty*p.price:null,urgent,split});
    stock=endStock; start=end;
  }
  const c0=res.chunks[0];
  res.F = res.chunks.reduce((a,c)=>a+c.F,0); res.qty = res.orders.reduce((a,o)=>a+o.qty,0);
  res.cost = p.price!=null? res.qty*p.price : null;
  res.daily=c0.daily; res.ss=c0.ss; res.rop=c0.rop; res.open=st.open;
  res.openQty = st.open.reduce((a,o)=>a+o.qty,0);
  res.endNoBuy = avail + res.openQty - res.F; res.endStock = res.chunks[res.chunks.length-1].endStock;
  res.firstDate = res.orders.length? res.orders[0].date : null;
  return res;
}

// FEFO: какие партии успеем израсходовать
function fefo(branch, sku){
  const st=STOCK[branch][sku]; const r=calcPurchase(branch,sku,'year');
  const daily = r.forecastMonths.reduce((a,x)=>a+x.f,0)/365;
  let cum=0; const out=[];
  for (const b of st.batches.slice().sort((a,b)=>a.exp-b.exp)){
    const days = diffDays(b.exp,TODAY);
    const startDay = daily>0? cum/daily : Infinity; cum+=b.qty;
    const usable = daily>0? Math.max(0, Math.min(b.qty, daily*days - (cum-b.qty))) : 0;
    const risk = Math.max(0, b.qty-usable);
    out.push({...b,days,risk:(P[sku].unit==='шт'?Math.round(risk):round1(risk)),consumeBy: daily>0? addDays(TODAY,Math.ceil(cum/daily)):null, startDay});
  }
  return out;
}

// Предупреждения
const WTYPES = {
  deficit:{name:'Риск дефицита',cls:'red'}, order14:{name:'Заказать в ближайшие 14 дней',cls:'amber'}, low:{name:'Ниже страхового запаса',cls:'amber'},
  excess:{name:'Избыточный запас',cls:'blue'}, nomove:{name:'Нет движения',cls:'grey'}, expiry:{name:'Срок годности',cls:'red'},
  sharp:{name:'Резкое изменение расхода',cls:'violet'}, price:{name:'Рост закупочной цены',cls:'violet'}, nodata:{name:'Недостаточно данных',cls:'grey'} };
function warnings(branch){
  const out=[];
  for (const p of PRODUCTS){
    const r=calcPurchase(branch,p.sku,'quarter'); const st=STOCK[branch][p.sku];
    const avail=r.avail;
    if (r.nodata.length){ if (r.F>0) out.push({t:'nodata',branch,sku:p.sku,text:`Нет данных: ${r.nodata.join(', ')}. Расчёт закупки не выполняется`}); continue; }
    if (r.daily>0){
      const lead=p.lead; const openLead=st.open.filter(o=>o.date<=addDays(TODAY,lead)).reduce((a,o)=>a+o.qty,0);
      const cover=(avail+openLead)/r.daily;
      if (cover<lead) out.push({t:'deficit',branch,sku:p.sku,text:`Остатка хватит на ${Math.floor(cover)} дн. (до ${fmtD(addDays(TODAY,Math.floor(cover)))}), поставка при заказе сегодня — ${fmtD(addDays(TODAY,lead))}`,sev:3});
      else if (r.firstDate && diffDays(r.firstDate,TODAY)<=14) out.push({t:'order14',branch,sku:p.sku,text:`${r.orders[0].urgent?'Заказать сегодня':'Заказать до '+fmtD(r.firstDate)}: ${fmtQ(r.orders[0].qty,p)} на ${fmtR(r.orders[0].cost)}`,sev:2});
      if (avail<r.ss && cover>=lead) out.push({t:'low',branch,sku:p.sku,text:`Остаток ${fmtQ(avail,p)} ниже страхового запаса ${fmtQ(r.ss,p)}`,sev:2});
      const coverAll=(avail+r.openQty)/r.daily;
      if (coverAll>120) out.push({t:'excess',branch,sku:p.sku,text:`Запаса хватит на ${Math.round(coverAll)} дн. при норме до 120. Заморожено ${fmtR(avail*p.price)}`,sev:1});
      const avg=st.fact90/3, ch=st.fact30/avg-1;
      if (Math.abs(ch)>0.3) out.push({t:'sharp',branch,sku:p.sku,text:`Расход за 30 дн. ${ch>0?'вырос':'снизился'} на ${Math.abs(Math.round(ch*100))}% к среднему за 90 дн. Проверьте норму расхода и загрузку`,sev:1});
    } else if (avail>0){
      out.push({t:'excess',branch,sku:p.sku,text:`Позиция не используется в текущих услугах, остаток ${fmtQ(avail,p)} на ${fmtR(avail*p.price)}`,sev:1});
    }
    if (st.lastMove>60 && avail>0) out.push({t:'nomove',branch,sku:p.sku,text:`Нет движения ${st.lastMove} дн. Остаток ${fmtQ(avail,p)}`,sev:1});
    for (const b of fefo(branch,p.sku)){
      if (b.days<0) continue;
      if (b.risk>0) out.push({t:'expiry',branch,sku:p.sku,text:`Партия ${b.id}: срок до ${fmtD(b.exp)}, не успеем израсходовать ${fmtQ(b.risk,p)} (${fmtR(b.risk*p.price)})`,sev:3});
      else if (b.days<=60) out.push({t:'expiry',branch,sku:p.sku,text:`Партия ${b.id}: срок до ${fmtD(b.exp)} (${b.days} дн.), по FEFO расходуется первой`,sev:1});
    }
  }
  return out;
}
function priceWarnings(){
  return PRODUCTS.filter(p=>p.price!=null && p.price/p.prev-1>0.1).map(p=>({t:'price',branch:'all',sku:p.sku,text:`${p.supplier}: ${fmtR(p.prev)} → ${fmtR(p.price)} за ${p.unit} (+${fmtPct(p.price/p.prev-1)})`,sev:2}));
}
function allWarnings(branch){
  const bs = branch==='all'? BRANCHES.map(b=>b.id) : [branch];
  return bs.flatMap(warnings).concat(priceWarnings());
}

// План и бюджет
function plan(branch, period, cat, opt={}){
  const bs = branch==='all'? BRANCHES.map(b=>b.id) : [branch];
  const per=PERIODS[period]; const rows=[];
  for (const b of bs) for (const p of PRODUCTS){
    if (cat!=='all' && p.cat!=+cat) continue;
    const r=calcPurchase(b,p.sku,period,opt);
    rows.push({b,p,r});
  }
  const months = MONTHS.slice(0,per.n).map((M,i)=>({i,label:MNAME[M.m]+' '+String(M.y).slice(2),y:M.y,m:M.m,sum:0}));
  const byCat={}, byBranch={}; let total=0;
  for (const x of rows){
    for (const o of x.r.orders){ if (o.cost==null) continue;
      const mi = months.findIndex(M=>M.y===o.date.getFullYear()&&M.m===o.date.getMonth());
      if (mi>=0) months[mi].sum+=o.cost; total+=o.cost;
      byCat[x.p.cat]=(byCat[x.p.cat]||0)+o.cost; byBranch[x.b]=(byBranch[x.b]||0)+o.cost; }
  }
  return {rows,months,byCat,byBranch,total,per,bs};
}
// Сравнение с III кварталом 2026 и разложение на факторы (только для квартала)
const PREV_BUY_SHARE = 0.85; // в III кв. закупили 85% от расхода — запасы снижались
const PRICE_HIST_K=[0.95,0.97,0.99,1]; // IV кв.25, I кв.26, II кв.26, III кв.26 (к цене prev)
const QLABELS=['IV кв. 2025','I кв. 2026','II кв. 2026','III кв. 2026','IV кв. 2026'];
function priceAt(p,qi){ return qi===4? p.price : p.prev*PRICE_HIST_K[qi]; }
const YOY_LOAD=0.92; // загрузка IV кв. 2025 была на 8% ниже плановой
function factors(branch, cat, base='yoy'){
  const bs = branch==='all'? BRANCHES.map(b=>b.id) : [branch];
  let B0=0,B1=0,demand=0,price=0,stockfx=0;
  for (const b of bs) for (const p of PRODUCTS){
    if (p.price==null) continue; if (cat!=='all' && p.cat!=+cat) continue;
    const r=calcPurchase(b,p.sku,'quarter'); const Q1=r.qty, P1=p.price, F1=r.F;
    if (!Object.keys(p.norms).length) continue;
    let F0,Q0,P0;
    if (base==='yoy'){ F0=F1*YOY_LOAD; Q0=Math.ceil(F0/p.pack)*p.pack; P0=priceAt(p,0); }
    else { F0=prevQuarterForecast(b,p.sku); Q0=Math.ceil(F0*PREV_BUY_SHARE/p.pack)*p.pack; P0=p.prev; }
    B0+=Q0*P0; B1+=Q1*P1;
    demand += (F1-F0)*P0;
    stockfx += ((Q1-F1)-(Q0-F0))*P0;
    price += (P1-P0)*Q1;
  }
  return {B0,B1,demand,price,stockfx,delta:B1-B0};
}
const LIMITS = {rh:850000, sr:650000, ad:650000}; // лимиты закупок на квартал

// Перемещения излишков между филиалами (снижают закупку и риск списания)
function transfers(){
  const out=[];
  for (const p of PRODUCTS){ if (p.price==null) continue;
    const info=BRANCHES.map(b=>{const r=calcPurchase(b.id,p.sku,'quarter');const surplus=r.daily>0? r.avail-r.daily*90 : 0;return {b:b.id,r,surplus};});
    for (const from of info) if (from.surplus>0 && from.r.avail/from.r.daily>120)
      for (const to of info) if (to.b!==from.b && to.r.qty>0){
        let q=Math.min(from.surplus,to.r.qty); q=p.unit==='шт'?Math.floor(q):Math.floor(q*10)/10; if (q<=0) continue;
        out.push({sku:p.sku,from:from.b,to:to.b,qty:q,save:q*p.price}); from.surplus-=q; }
  }
  return out;
}
// Себестоимость услуг
function serviceCost(branch, svcId, priceOverride={}){
  let now=0, base=0; const lines=[];
  for (const p of PRODUCTS){ const n=p.norms[svcId]; if (!n || p.price==null) continue;
    const q=n*kFact(branch,p.sku); const pn=priceOverride[p.sku]!==undefined?priceOverride[p.sku]:p.price;
    lines.push({p,q,now:q*pn,base:q*p.prev}); now+=q*pn; base+=q*p.prev; }
  return {now,base,lines};
}

function barsSVG(items, limitLine){
  const W=Math.max(300,items.length*52), H=150, pad=28; const max=Math.max(...items.map(i=>i.v), limitLine||0)*1.1||1;
  const bw=(W-pad)/items.length*0.62;
  let s=`<svg viewBox="0 0 ${W} ${H+22}" width="100%" style="max-height:200px">`;
  items.forEach((it,i)=>{ const x=pad+(W-pad)/items.length*i+((W-pad)/items.length-bw)/2; const h=it.v/max*H;
    s+=`<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" rx="3" fill="#1F5C6E"><title>${it.l}: ${fmtR(it.v)}</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${H+14}" font-size="10.5" text-anchor="middle" fill="#7A736B">${it.l}</text>`;
    if (it.v>0) s+=`<text x="${x+bw/2}" y="${H-h-4}" font-size="9.5" text-anchor="middle" fill="#1E1C1A">${Math.round(it.v/1000)}к</text>`; });
  if (limitLine){ const y=H-limitLine/max*H; s+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#B3261E" stroke-dasharray="5 4"/>`; }
  return s+'</svg>';
}

function stockChart(r,p){
  const days=r.chunks.reduce((a,c)=>a+c.D,0), W=640, H=210, pl=44, pb=24;
  const daily=[]; let di=0; r.chunks.forEach(ch=>ch.months.forEach(m=>{const M=MONTHS[m.mi];const n=monthDays(M.y,M.m);for(let i=0;i<n;i++)daily.push(m.f/n);}));
  const arrivals={}, own={};
  r.open.forEach(o=>{const k=diffDays(o.date,TODAY); arrivals[k]=(arrivals[k]||0)+o.qty;});
  r.orders.forEach(o=>{const k=diffDays(o.date,TODAY)+(p.lead||0); own[k]=(own[k]||0)+o.qty;});
  let s1=r.avail, s2=r.avail; const a=[], b=[];
  for (let t=0;t<=days;t++){ a.push(s1); b.push(s2); s1+= (arrivals[t]||0)+(own[t]||0)-(daily[t]||0); s2+=(arrivals[t]||0)-(daily[t]||0); }
  const max=Math.max(...a,r.rop)*1.1, min=Math.min(0,...b);
  const X=t=>pl+(W-pl-8)*t/days, Y=v=>8+(H-8-pb)*(1-(v-min)/(max-min));
  const path=arr=>arr.map((v,t)=>(t?'L':'M')+X(t).toFixed(1)+','+Y(v).toFixed(1)).join('');
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for (let i=0;i<=4;i++){const v=min+(max-min)*i/4; s+=`<line x1="${pl}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEE9E1"/><text x="${pl-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#7A736B">${fmtN(v,0)}</text>`;}
  let acc=0; r.chunks.forEach(ch=>ch.months.forEach(m=>{const M=MONTHS[m.mi]; s+=`<text x="${X(acc)+4}" y="${H-6}" font-size="10" fill="#7A736B">${MNAME[M.m]}</text><line x1="${X(acc)}" x2="${X(acc)}" y1="8" y2="${H-pb}" stroke="#F3EFE8"/>`; acc+=monthDays(M.y,M.m);}));
  if (min<0) s+=`<rect x="${pl}" y="${Y(0)}" width="${W-pl-8}" height="${Y(min)-Y(0)}" fill="#FBEAE8" opacity=".6"/>`;
  s+=`<line x1="${pl}" x2="${W-8}" y1="${Y(r.rop)}" y2="${Y(r.rop)}" stroke="#A86A12" stroke-dasharray="5 4"/>`;
  s+=`<line x1="${pl}" x2="${W-8}" y1="${Y(r.ss)}" y2="${Y(r.ss)}" stroke="#B3261E" stroke-dasharray="3 3"/>`;
  s+=`<path d="${path(b)}" fill="none" stroke="#B9B2A7" stroke-width="2"/><path d="${path(a)}" fill="none" stroke="#1F5C6E" stroke-width="2.4"/>`;
  r.orders.forEach(o=>{const t=diffDays(o.date,TODAY); s+=`<circle cx="${X(t)}" cy="${Y(a[t])}" r="5" fill="#A8844F"/><text x="${X(t)+7}" y="${Y(a[t])-8}" font-size="10.5" fill="#1E1C1A">заказ ${fmtN(o.qty,1)} ${p.unit}</text>`;});
  return s+'</svg>';
}

      <tr><td><b>Перенести заказы, срок которых позже 30 дней</b><div class="small muted">${defer.length} заказ(ов): ${[...new Set(defer.map(d=>d.x.p.name))].slice(0,4).join(', ')}${defer.length>4?'…':''}</div></td><td class="n">${fmtR(deferSum)}</td><td><span class="chip amber">средний</span> заказ нужно разместить в начале следующего периода</td></tr>
      <tr><td><b>Снизить страховой запас до 5 дней</b><div class="small muted">по всем позициям периода</div></td><td class="n">${fmtR(ssSave)}</td><td><span class="chip red">высокий</span> меньше защиты от задержки поставки и всплеска спроса</td></tr>
     </table>
     <div class="notice sec">Комбинация «перемещение + перенос» даёт ${fmtR(trSum+deferSum)} ${trSum+deferSum>=over?'и укладывает план в лимит без снижения страхового запаса.':'; для полного попадания в лимит нужно дополнительно снизить страховой запас или согласовать увеличение лимита.'}</div></div>`;
  } else variants=`<div class="notice green sec">План укладывается в лимит: резерв ${fmtR(-over)} (${fmtPct(-over/lim,0)}).</div>`;
  const wf = f? waterfall(f) : '<div class="muted small">Сравнение с базой и факторный анализ доступны для квартального плана.</div>';
  const catRows=Object.entries(pl.byCat).map(([k,v])=>`<tr><td>${CATS[k]}</td><td class="n">${fmtR(v)}</td><td class="n">${fmtPct(v/pl.total,0)}</td></tr>`).join('');
  const brRows=Object.entries(pl.byBranch).map(([k,v])=>`<tr><td>${bname(k)}</td><td class="n">${fmtR(v)}</td><td class="n">${fmtR(limitFor(k,S.period))}</td></tr>`).join('');

   <div class="card kpi ${over>0?'alert':''}"><div class="l">Лимит</div><div class="v"><input type="number" step="10000" value="${lim}" style="width:150px;font-size:18px;font-weight:600" onchange="S.limit['${S.branch}|${S.period}']=+this.value;renderPlan()"> ₽</div><div class="bar ${over>0?'over':''}" style="margin-top:6px"><i style="width:${Math.min(100,pl.total/lim*100)}%"></i></div><div class="s">${over>0?'превышение '+fmtR(over):'использовано '+fmtPct(pl.total/lim,0)}</div></div>
   <div class="card kpi"><div class="l">Сравнение: <select onchange="S.base=this.value;renderPlan()" style="font-size:12px;padding:2px 6px"><option value="yoy" ${S.base==='yoy'?'selected':''}>IV кв. 2025 (год назад)</option><option value="qoq" ${S.base==='qoq'?'selected':''}>III кв. 2026</option></select></div><div class="v">${f?(f.delta>0?'+':'')+fmtR(f.delta):'—'}</div><div class="s">${f?'база '+fmtR(f.B0)+' · '+(f.delta>0?'+':'')+fmtPct(f.delta/f.B0,0):'только для квартала'}</div></div>

  </div>
  ${variants}
  <div class="card sec" id="plantable"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><h3 style="margin:0">План закупок: ${per.title}</h3><span class="muted small">суммы по периодам в тыс. ₽</span>

   <div style="overflow:auto"><table><tr><th>Товар</th><th class="n">Прогноз</th><th class="n">Остаток + заказы</th><th class="n">Закупить</th><th>Дата заказа</th><th class="n">Стоимость</th>${cols.map(c=>`<th class="n">${c.l}</th>`).join('')}<th>Статус</th></tr>${rowsH}</table></div>
   <div class="small muted" style="margin-top:8px">Заказы в MVP не размещаются автоматически: утверждённый план выгружается для специалиста по закупкам и финансового менеджера.</div></div>`;

function waterfall(f){
  const items=[{l:'База',v:f.B0,t:'base'},{l:'Спрос',v:f.demand},{l:'Остатки и СЗ',v:f.stockfx},{l:'Цены',v:f.price},{l:'План',v:f.B1,t:'base'}];
  const W=320,H=170,pb=30; const max=Math.max(f.B0,f.B1,f.B0+Math.max(0,f.demand))*1.12;
  const Y=v=>8+(H-pb-8)*(1-v/max); const bw=44; let run=f.B0, s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  items.forEach((it,i)=>{ const x=10+i*62; let y0,y1,col;
    if (it.t){ y0=Y(it.v); y1=Y(0); col='#1E1C1A'; } else { const a=run, b=run+it.v; y0=Y(Math.max(a,b)); y1=Y(Math.min(a,b)); col=it.v>=0?'#B3261E':'#2F6B3F'; run=b; }
    s+=`<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(1,y1-y0)}" fill="${col}" rx="2"/><text x="${x+bw/2}" y="${H-16}" font-size="10" text-anchor="middle" fill="#7A736B">${it.l}</text><text x="${x+bw/2}" y="${y0-4}" font-size="10" text-anchor="middle" fill="#1E1C1A">${it.t?Math.round(it.v/1000)+'к':(it.v>0?'+':'−')+Math.abs(Math.round(it.v/1000))+'к'}</text>`; });
  s+='</svg>';
  return s+`<div class="small muted">Изменение ${f.delta>0?'+':''}${fmtR(f.delta)}: спрос (загрузка) ${sgn(f.demand)}, восстановление или расход запасов ${sgn(f.stockfx)}, рост цен ${sgn(f.price)}. <span style="color:var(--red)">■</span> увеличивает, <span style="color:var(--green)">■</span> снижает бюджет.</div>`;
}
const sgn=v=>(v>=0?'+':'−')+fmtR(Math.abs(v));
function exportPlan(){
  const pl=plan(S.branch,S.period,S.cat); const rows=[['Филиал','SKU','Товар','Категория','Прогноз','Остаток+заказы','Закупить','Ед.','Дата заказа','Цена','Стоимость','Поставщик']];
  for (const {b,p,r} of pl.rows) if (r.qty) rows.push([bname(b),p.sku,p.name,CATS[p.cat],fmtN(r.F,1),fmtN(r.avail+r.openQty,1),fmtN(r.qty,1),p.unit,r.firstDate?fmtD(r.firstDate):'',p.price??'нет данных',r.cost?Math.round(r.cost):'',p.supplier]);
  rows.push([],['Итого','','','','','','','','','',Math.round(pl.total)],['Лимит','','','','','','','','','',limitFor(S.branch,S.period)],['Дата актуальности',fmtD(TODAY)]);
  download(`План_закупок_${bname(S.branch)}_${PERIODS[S.period].label}.csv`,rows);
}
function approvePlan(){
  const pl=plan(S.branch,S.period,S.cat), lim=limitFor(S.branch,S.period);
  const now=new Date(); S.journal.unshift({ts:fmtD(TODAY)+' '+now.toTimeString().slice(0,5), who:'Управляющий (демо)', scope:`${bname(S.branch)} · ${PERIODS[S.period].title}${S.cat!=='all'?' · '+CATS[S.cat]:''}`, total:pl.total, limit:lim, st:pl.total>lim?'Утверждён с превышением':'Утверждён', note:`Страховой запас по правилам компании; цены на ${fmtD(TODAY)}; ${pl.rows.filter(x=>x.r.qty).length} позиций`});
  toast('План утверждён и сохранён в журнале решений. <span class="linkish" onclick="go(\'journal\')">Открыть журнал</span>');
}

// ===== Экран 4. Сроки годности =====
function renderExpiry(){
  const rows=[]; let riskSum=0;
  for (const b of scopeB()) for (const p of PRODUCTS){ if (S.cat!=='all'&&p.cat!=+S.cat) continue;
    const r=calcPurchase(b,p.sku,'quarter');
    for (const x of fefo(b,p.sku)){ if (x.days<0||(x.days>120&&x.risk<=0)) continue; rows.push({b,p,x,r}); if (p.price) riskSum+=x.risk*p.price; } }
  rows.sort((a,b)=>(b.x.risk>0)-(a.x.risk>0)||a.x.days-b.x.days);
  const rec = ({b,p,x,r}) => {
    if (x.risk<=0) return x.days<=60?'Использовать в первую очередь (FEFO), выдавать мастерам из этой партии':'В норме';
    const other=BRANCHES.filter(o=>o.id!==b).map(o=>({o,r:calcPurchase(o.id,p.sku,'quarter')})).filter(z=>z.r.daily>0).sort((a,c)=>c.r.daily-a.r.daily)[0];
    const canUse = other? Math.min(x.risk, other.r.daily*x.days*0.5) : 0;
    let t = other && canUse>0? `Переместить ${fmtQ(canUse,p)} в ${other.o.name} (расход там ${fmtN(other.r.daily,2)} ${p.unit}/день)` : 'Использовать в акции или новой услуге';
    if (r.qty>0) t+=`; не закупать до ${fmtD(x.exp)}`;
    return t; };
  $('#view').innerHTML=`<div class="grid g3">
   <div class="card kpi"><div class="l">Партий со сроком до 120 дней или с риском</div><div class="v">${rows.length}</div><div class="s">${bname(S.branch)}</div></div>
   <div class="card kpi ${rows.some(r=>r.x.risk>0)?'alert':''}"><div class="l">Под риском списания</div><div class="v">${rows.filter(r=>r.x.risk>0).length} парт.</div><div class="s">не успеем израсходовать до окончания срока</div></div>
   <div class="card kpi ${riskSum?'alert':''}"><div class="l">Сумма риска списания</div><div class="v">${fmtR(riskSum)}</div><div class="s">по закупочным ценам</div></div></div>
   <div class="card sec"><h3>Партии по сроку годности</h3><div class="small muted" style="margin-bottom:8px">Порядок расхода FEFO: первой уходит партия с ближайшим сроком. Риск = остаток партии минус прогнозный расход до даты окончания срока.</div>
   <table><tr><th>Товар</th><th>Филиал</th><th>Партия</th><th class="n">Остаток</th><th>Годен до</th><th class="n">Дней</th><th class="n">Риск списания</th><th>Рекомендация</th></tr>
   ${rows.map(z=>`<tr><td><span class="linkish" onclick="openCalc('${z.b}','${z.p.sku}')">${z.p.name}</span></td><td>${bname(z.b)}</td><td>${z.x.id}</td><td class="n">${fmtQ(z.x.qty,z.p)}</td><td>${fmtD(z.x.exp)}</td><td class="n">${z.x.days<=60?`<span class="chip ${z.x.days<=30?'red':'amber'}">${z.x.days}</span>`:z.x.days}</td><td class="n">${z.x.risk>0?`<b style="color:var(--red)">${fmtQ(z.x.risk,z.p)}</b><div class="small muted">${fmtR(z.x.risk*(z.p.price||0))}</div>`:'—'}</td><td class="small">${rec(z)}</td></tr>`).join('')}</table>
   <div class="small muted" style="margin-top:8px">Списание в MVP не выполняется автоматически: решение принимает управляющий.</div></div>`;
}

  const br=S.svcBranch;

  const wp=P[S.whatif.sku]; const wi=SERVICES.filter(s=>wp.norms[s.id]).map(s=>{const a=serviceCost(br,s.id), b=serviceCost(br,s.id,{[wp.sku]:+S.whatif.price}); const qn=[0,1,2].reduce((x,mi)=>x+procedures(br,s.id,mi),0); return {s,a:a.now,b:b.now,qn};});

    ${pr.map(x=>`<tr><td>${x.p.name}<div class="small muted">${x.p.supplier} · за ${x.p.unit}</div></td>${QLABELS.map((l,i)=>`<td class="n" style="${i===bi?'background:#FAF7F2;font-weight:600':''}">${fmtN(priceAt(x.p,i),0)}</td>`).join('')}<td class="n">${x.d>0?'+':''}${fmtN(x.d,0)}</td><td class="n">${x.pc>0.1?`<span class="chip red">+${fmtPct(x.pc)}</span>`:(x.pc>0?'+':'')+fmtPct(x.pc)}</td></tr>`).join('')}</table>
    <div class="small muted" style="margin-top:6px">Источник: накладные и прайсы поставщиков. Цена периода — средневзвешенная по закупкам. Порог сигнала: рост больше 10%.</div></div>
   <div class="card"><h3>Себестоимость услуг и маржа · ${bname(br)}</h3><table><tr><th>Услуга</th><th class="n">Цена</th><th class="n">Материалы, база</th><th class="n">Сейчас</th><th class="n">Δ ₽ / %</th><th class="n">Маржа по материалам</th><th class="n">Δ маржи за IV кв.</th></tr>
    ${svc.map(x=>`<tr><td>${x.s.name}</td><td class="n">${fmtN(x.s.price,0)}</td><td class="n">${fmtN(x.base,1)}</td><td class="n">${fmtN(x.now,1)}</td><td class="n">+${fmtN(x.now-x.base,1)}<div class="small muted">+${fmtPct(x.now/x.base-1)}</div></td><td class="n">${fmtN(x.s.price-x.now,0)}<div class="small muted">${fmtPct((x.s.price-x.now)/x.s.price)}</div></td><td class="n" style="color:var(--red)">−${fmtR((x.now-x.base)*x.qn)}<div class="small muted">${Math.round(x.qn).toLocaleString('ru-RU')} процедур</div></td></tr>`).join('')}</table>
    <details class="sec"><summary class="small" style="cursor:pointer;color:var(--sand);font-weight:600">Состав материалов: ${svc[0].s.name}</summary><table>${svc[0].lines.map(l=>`<tr><td>${l.p.name}</td><td class="n">${fmtN(l.q,4)} ${l.p.unit}</td><td class="n">${fmtN(priceAt(l.p,bi),0)} → ${fmtN(l.p.price,0)} ₽</td><td class="n">${fmtN(l.q*priceAt(l.p,bi),1)} → ${fmtN(l.now,1)} ₽</td></tr>`).join('')}</table></details>

  </div>
  <div class="card sec"><h3>Что будет, если цена изменится</h3><div class="params"><label>Товар<select onchange="S.whatif.sku=this.value;S.whatif.price=P[this.value].price;renderPrices()">${PRODUCTS.filter(p=>p.price!=null&&Object.keys(p.norms).length).map(p=>`<option value="${p.sku}" ${S.whatif.sku===p.sku?'selected':''}>${p.name}</option>`).join('')}</select></label>

}

function renderJournal(){

      ['Прогноз расхода IV кв.',fmtQ(a.F,p),fmtQ(b.F,p),'+'+fmtQ(b.F-a.F,p)],['Страховой запас',fmtQ(a.ss,p),fmtQ(b.ss,p),'+'+fmtQ(b.ss-a.ss,p)],['Объём закупки',fmtQ(a.qty,p),fmtQ(b.qty,p),'+'+fmtQ(b.qty-a.qty,p)],['Стоимость',fmtR(a.cost),fmtR(b.cost),'+'+fmtR(b.cost-a.cost)],['Дата заказа',fmtD(a.firstDate),fmtD(b.firstDate),'']])}
      ${b.qty===a.qty?'Объём не изменился: прирост расхода покрывается округлением до коробки.':`Нужно на ${Math.round((b.qty-a.qty)/p.pack)} ${p.packName.split(' ')[0]} больше.`}${bNote}
      ${why(`Процедуры ${mi===null?'всех месяцев':MNAME[MONTHS[mi].m]} × ${1+n/100}. Далее тот же расчёт: прогноз + СЗ − остаток − открытые заказы, кратность ${p.pack} ${p.unit}.`)}`,fn:`calc_purchase(sku="${sku}", branch="${b1}", horizon=3, load_adj=${JSON.stringify(adj)})`};
  }
  // резкое изменение расхода
  if (/резк|изменил.*расход|расход.*изменил/.test(t)){
    const W=scope.flatMap(warnings).filter(w=>w.t==='sharp');
    return {html:`<h4>Резкое изменение расхода за последние 30 дней</h4>${W.length?tbl(['Товар · филиал','Расход 30 дн.','Средний за 90 дн.','Изменение'],W.map(w=>{const st=STOCK[w.branch][w.sku],p=P[w.sku];return [`${p.name}<div class="small muted">${bname(w.branch)}</div>`,fmtQ(st.fact30,p),fmtQ(st.fact90/3,p),`<span class="chip violet">${st.fact30>st.fact90/3?'+':'−'}${Math.abs(Math.round((st.fact30/(st.fact90/3)-1)*100))}%</span>`];})):'Резких изменений нет.'}
      Возможные причины: изменение нормы закладки у мастеров, акция или рост записей на услугу, ошибка учёта списания. Рекомендую сверить с журналом процедур; если изменение устойчивое, скорректировать норму в техкарте, и прогноз пересчитается.
      ${why('Сравнение фактического расхода за 30 дней со средним месячным за 90 дней. Порог сигнала ±30%.')}`,fn:`consumption_anomalies(branches=${JSON.stringify(scope)}, threshold=0.3)`};
  }
  // когда заказать
  if (/когда/.test(t) && sku){
    const r=calcPurchase(b1,sku,'quarter'),p=P[sku];
    return {html:`<h4>${p.name}, ${bname(b1)}: заказать ${r.orders.some(o=>o.urgent)?'<span style="color:var(--red)">сегодня</span>':r.firstDate?'до '+fmtD(r.firstDate):'в этом квартале не нужно'}</h4>
      Остаток ${fmtQ(r.avail,p)}${r.openQty?` + открытые заказы ${fmtQ(r.openQty,p)}`:''}, расход ${fmtN(r.daily,2)} ${p.unit}/день. Точка заказа ${fmtQ(r.rop,p)} = расход за срок поставки ${p.lead} дн. + страховой запас ${fmtQ(r.ss,p)}.
      ${r.firstDate?`Остаток дойдёт до точки заказа ${fmtD(r.firstDate)}; поставка придёт ${fmtD(addDays(r.firstDate,p.lead))}, до выхода на страховой запас. Объём: ${fmtQ(r.qty,p)} на ${fmtR(r.cost)}.`:''}${bNote}
      ${why(`Дата заказа = сегодня + (остаток + открытые заказы − точка заказа) ÷ среднесуточный расход = ${fmtD(TODAY)} + (${fmtN(r.chunks[0].stockStart,1)} + ${fmtN(r.chunks[0].arrQty,1)} − ${fmtN(r.rop,1)}) ÷ ${fmtN(r.daily,3)}.`)}`,fn:`calc_purchase(sku="${sku}", branch="${b1}", horizon=3) → order_date`};
  }
  // сколько закупить
  if (sku && /сколько|закуп|заказ|нужно/.test(t) && !/остат/.test(t)){
    const p2=per||'quarter'; const r=calcPurchase(b1,sku,p2),p=P[sku];
    const perNote= per? '' : `<div class="notice" style="margin:6px 0">Период не указан. Я взяла <b>квартал (IV кв. 2026)</b>, это стандартный цикл заказа. Могу пересчитать на месяц, полугодие или год.</div>`;
    return {html:`<h4>${p.name}, ${bname(b1)}, ${PERIODS[p2].title}</h4>${perNote}${tbl(['Показатель','Значение'],[
      ['Прогнозный расход',`${fmtQ(r.F,p)} (${fmtN(r.daily,2)} ${p.unit}/день)`],['Текущий доступный остаток',fmtQ(r.avail,p)],['Открытые заказы',r.open.map(o=>`${fmtQ(o.qty,p)} (${fmtD(o.date)})`).join(', ')||'нет'],
      ['Ожидаемый остаток без закупки',`<span style="color:${r.endNoBuy<0?'var(--red)':'inherit'}">${fmtQ(r.endNoBuy,p)}</span>`],['Страховой запас',`${fmtQ(r.ss,p)} (${r.ssDays} дн.)`],['Рекомендуемый объём закупки',`<b>${fmtQ(r.qty,p)}</b> (${Math.round(r.qty/p.pack)} × ${p.packName})`],
      ['Ориентировочная стоимость',`<b>${fmtR(r.cost)}</b> (${fmtR(p.price)} за ${p.unit})`],['Рекомендуемая дата заказа',`<b>${r.orders.some(o=>o.urgent)?'сегодня, срочно':'до '+fmtD(r.firstDate)}</b>`],['Остаток на конец с закупкой',fmtQ(r.endStock,p)]])}${bNote}
      ${p.price>p.prev*1.1?`<div class="small" style="color:var(--red)">Цена выросла на ${fmtPct(p.price/p.prev-1)} к прошлой закупке.</div>`:''}
      ${why(`Прогноз = плановые процедуры × норма техкарты × коэф. факт/норма ${fmtN(kFact(b1,sku),2)}. Потребность = ${fmtN(r.F,1)} + ${fmtN(r.ss,1)} − ${fmtN(r.avail,1)} − ${fmtN(r.openQty,1)} = ${fmtN(r.chunks.reduce((a,c)=>a+Math.max(0,c.need),0),1)} ${p.unit}, округлено до кратности ${p.pack}. Стоимость = ${fmtN(r.qty,1)} × ${fmtR(p.price)}. Цена: прайс ${p.supplier} от 15.09.2026. Допущения: расход равномерный, поставка в срок ${p.lead} дн.`)}
      <div style="margin-top:6px"><button class="btn ghost" onclick="S.calc={branch:'${b1}',sku:'${sku}',period:'${p2}',load:0,ss:null};go('calc')">Открыть расчёт с графиком</button></div>`,fn:`calc_purchase(sku="${sku}", branch="${b1}", horizon=${PERIODS[p2].n})`};
  }
  // остаток по товару
  if (sku && /остат|сколько.*(есть|на складе)|парти/.test(t)){
    const p=P[sku]; const list=bs.length?bs:(S.branch!=='all'?[S.branch]:[b1]);
    const rows=[]; for (const b of list) for (const x of fefo(b,sku)) rows.push([`${x.id}<div class="small muted">${bname(b)}</div>`,fmtQ(x.qty,p),fmtD(x.exp),x.days<0?'просрочена':x.risk>0?'<span class="chip red">риск списания</span>':x.days<=60?'<span class="chip amber">расходовать первой</span>':'в норме']);
    const tot=list.reduce((a,b)=>a+available(b,sku),0); const open=list.flatMap(b=>STOCK[b][sku].open);
    return {html:`<h4>${p.name}: доступно ${fmtQ(tot,p)}</h4>${tbl(['Партия','Остаток','Годен до','Статус'],rows)}${open.length?`Открытые заказы: ${open.map(o=>`${o.no} — ${fmtQ(o.qty,p)}, поставка ${fmtD(o.date)}`).join('; ')}.`:''} Хватит примерно на ${Math.floor(tot/calcPurchase(list[0],sku,'quarter').daily)} дн. при плановом расходе.${bNote}
      ${why(`Источник: складской учёт по партиям на ${fmtD(TODAY)} 08:00. Доступный остаток = сумма партий без просроченных и заблокированных. Порядок расхода FEFO.`)}`,fn:`get_stock(sku="${sku}", branches=${JSON.stringify(list)}, by="batch")`};
  }
  // списки предупреждений
  const lists=[
    [/без движ|не двига|не использ/,'nomove','Товары без движения больше 60 дней'],
    [/излиш|избыт|затовар/,'excess','Избыточный запас'],
    [/истека|срок годн|использовать перв/,'expiry','Партии с истекающим сроком (≤ 60 дней) и риском списания'],
    [/закончат|дефицит|не хватит/,'deficit','Закончатся раньше следующей поставки'],
    [/14 дн|две недели|нужно заказать|что заказать/,'order','Нужно заказать в ближайшие 14 дней'],
  ];
  for (const [re,type,title] of lists) if (re.test(t)){
    let W=scope.flatMap(warnings); W = type==='order'? W.filter(w=>w.t==='deficit'||w.t==='order14') : W.filter(w=>w.t===type);
    const rows=W.map(w=>{const p=P[w.sku]; const r=calcPurchase(w.branch,w.sku,'quarter'); return type==='order'||type==='deficit'?[`${p.name}<div class="small muted">${bname(w.branch)}</div>`,fmtQ(r.avail+r.openQty,p),r.orders.some(o=>o.urgent)?'<span class="chip red">сегодня</span>':fmtD(r.firstDate),fmtQ(r.qty,p),fmtR(r.cost)]:[`${p.name}<div class="small muted">${bname(w.branch)}</div>`,w.text];});
    const sum=type==='order'||type==='deficit'? W.reduce((a,w)=>a+(calcPurchase(w.branch,w.sku,'quarter').cost||0),0):0;
    return {html:`<h4>${title}: ${W.length}</h4>${rows.length?tbl(type==='order'||type==='deficit'?['Товар · филиал','Остаток + заказы','Заказать','Объём','Стоимость']:['Товар · филиал','Детали'],rows):'Таких позиций нет.'}${sum?`Итого к заказу: <b>${fmtR(sum)}</b>.`:''}
      ${type==='expiry'?' Рекомендация: партии с риском переместить в филиал с большим расходом или использовать в первую очередь; по этим товарам не закупать до окончания срока.':''}
      ${why(({deficit:'Риск дефицита: (остаток + заказы, приходящие в пределах срока поставки) ÷ среднесуточный расход < срок поставки.',order:'Дата заказа = сегодня + (остаток + открытые заказы − точка заказа) ÷ среднесуточный расход ≤ 14 дней.',expiry:'FEFO-моделирование: остаток партии минус прогнозный расход до даты окончания срока.',nomove:'Дата последнего расхода по складскому учёту старше 60 дней.',excess:'Покрытие запаса = (остаток + открытые заказы) ÷ среднесуточный расход > 120 дней.'})[type])}`,fn:`get_alerts(type="${type}", branches=${JSON.stringify(scope)})`};
  }
  return {html:`Я пока не поняла вопрос. Попробуйте сформулировать про конкретный товар, филиал или период, например: «Сколько скраба закупить на квартал для Сириуса?», «Какие партии истекают?», «План закупок на полугодие». Список проверенных вопросов справа.`,fn:'intent_parser → unknown'};
}

// ===== Демо-сценарий =====
const DEMO=[
 {st:'Шаг 1 из 5 · Состояние склада',h:'Что происходит на складе прямо сейчас',p:'Дашборд собирает остатки, партии, заказы и загрузку трёх филиалов. Сразу видно, что заказать в ближайшие 14 дней, где риск дефицита и сколько денег под риском списания.',run:()=>{S.branch='all';S.period='quarter';S.cat='all';S.wf=null;go('dash');},hl:'#kpis'},
 {st:'Шаг 2 из 5 · Прогноз',h:'Сколько масла нужно на квартал',p:'Ключевой вопрос заказчика. Прогноз строится по плановой загрузке и нормам техкарт, с учётом партий, открытого заказа и страхового запаса. Итог: 84 л на 155 400 ₽, заказать до 13.10.2026. Ниже обоснование каждой цифры.',run:()=>{S.calc={branch:'rh',sku:'MO-01',period:'quarter',load:0,ss:null};go('calc');},hl:'#tiles'},
 {st:'Шаг 3 из 5 · Риск',h:'Какие риски требуют решения',p:'Эфирное масло лаванды на Розе Хутор закончится раньше, чем придёт поставка, поэтому заказ нужен сегодня. У травяного сбора излишек, и часть партии не успеет израсходоваться до конца срока годности. Лаванда и водоросли подорожали больше чем на 10%.',run:()=>{S.branch='rh';S.wf=new Set(['deficit','expiry','excess','price']);go('dash');},hl:'#warns'},
 {st:'Шаг 4 из 5 · План закупки',h:'План на квартал в один клик',p:'Позиции сгруппированы по категориям и распределены по месяцам заказа, у каждой есть объём, дата, стоимость и статус. Любую строку можно открыть и увидеть расчёт.',run:()=>{S.branch='rh';S.period='quarter';S.cat='all';go('plan');setTimeout(()=>$('#plantable').scrollIntoView({behavior:'smooth'}),50);},hl:'#plantable'},
 {st:'Шаг 5 из 5 · Бюджет',h:'Бюджет, лимит и варианты',p:'Бюджет сравнивается с лимитом и с прошлым годом, изменение раскладывается на спрос, запасы и цены. При превышении лимита помощник предлагает варианты с оценкой риска. Решение управляющего фиксируется в журнале.',run:()=>{go('plan');window.scrollTo({top:0,behavior:'smooth'});},hl:'#budget'},
];
let demoI=-1;
function demoStart(){ demoI=0; demoShow(); }
function demoShow(){
  document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  if (demoI<0||demoI>=DEMO.length){ $('#demo').style.display='none'; return; }
  const s=DEMO[demoI]; s.run(); setTimeout(()=>{const e=$(s.hl); if(e) e.classList.add('hl');},80);
  $('#demo').style.display='block';
  $('#demo').innerHTML=`<div class="st">${s.st}</div><div class="dots">${DEMO.map((_,i)=>`<i class="${i<=demoI?'on':''}"></i>`).join('')}</div><h4>${s.h}</h4><p>${s.p}</p><div class="row"><button class="btn ghost" onclick="demoI=-1;demoShow()">Закрыть</button>${demoI>0?'<button class="btn ghost" onclick="demoI--;demoShow()">Назад</button>':''}<button class="btn sand" onclick="demoI++;demoShow()">${demoI<DEMO.length-1?'Далее':'Готово'}</button></div>`;
}
render();
</script></body></html>
